<!doctype html>
<html lang="ka" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe - თამაშები</title>
    <link rel="icon" type="image/png" href="../logo/tabIcon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./ticTacToe.js" defer></script>
    <style>
      body {
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      /* Absolute stability: cells are strictly fixed and never change size */
      .cell {
        width: 112px;
        height: 112px;
        flex-shrink: 0;
        flex-grow: 0;
        box-sizing: border-box;
      }
    </style>
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="bg-[#F4F6F4] text-[#2C3E50]">
    <!-- ================= First Header (Static) ================= -->
    <header
      class="w-full bg-[#EAEFE9] border-b border-[#D8E2D6] py-4 px-6 transition-colors duration-300"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <!-- Left side: 3 logos with links -->
        <div class="flex items-center gap-4">
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/facebook.svg" alt="facebook link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/instagram.svg" alt="instagram link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/tiktok.svg" alt="tikTok link" />
          </a>
        </div>

        <!-- Center: Centered text -->
        <div class="text-center">
          <p class="text-sm tracking-wide text-[#5C6B5E] font-medium">
            შეისვენე და აღიდგინე ენერგია
          </p>
        </div>

        <!-- Right side: Links (in a box)-->
        <div class="flex items-center gap-4">
          <!-- Text embedded in a nice background frame -->
          <nav
            class="flex items-center gap-2 bg-[#DFE7DE] px-4 py-1.5 rounded-full shadow-inner"
          >
            <a
              href="../views/aboutUs.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >ჩვენს შესახებ</a
            >
            <span class="text-[#A3B1A0]">•</span>
            <a
              href="../views/feedBack.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >გამოხატე შენი აზრი</a
            >
          </nav>
        </div>
      </div>
    </header>

    <!-- ================= Second Header (Sticky / follows the page) ================= -->
    <header
      class="sticky top-0 z-50 w-full bg-[#FFFFFF]/90 backdrop-blur-md border-b border-[#E2E8E0] shadow-sm transition-all duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <!-- Left side: Main logo -->
        <a href="../index.html" class="flex items-center gap-2 group">
          <div
            class="w-10 h-10 rounded-xl bg-[#E3EBE1] flex items-center justify-center group-hover:bg-[#D2DDD0] transition"
          >
            <img src="../logo/mainLogo.svg" alt="mainLogo" />
          </div>
          <span class="font-semibold text-lg text-[#3B4A3F] tracking-tight"
            >MODE:OFF</span
          >
        </a>

        <!-- Right side  -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-3">
          <a
            href="../views/quizzes.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >ქვიზნი</a
          >
          <a
            href="../views/eyeRest.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თვალის სიმშვიდე</a
          >
          <a
            href="../views/games.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თამაშები</a
          >
          <a
            href="../views/Idleness.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >უსაქმურობა</a
          >
          <a
            href="../views/simplifyYourLife.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >გაიმარტივე ცხოვრება</a
          >
          <a
            href="../views/whatToEat.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >რა ვჭამო?</a
          >
        </nav>
      </div>
    </header>
    <!-- ================= Main Game Container ================= -->
    <main class="max-w-xl mx-auto px-6 py-12 w-full flex flex-col items-center">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-light mb-2">Tic-Tac-Toe</h1>
        <p class="text-sm opacity-75">აირჩიე რეჟიმი და გამოსცადე შენი ლოგიკა</p>
      </div>

      <!-- Game Panel -->
      <div
        class="w-full bg-white dark:bg-[#324338] p-6 rounded-3xl shadow-sm border border-[#EBEFEA] dark:border-[#42574A] transition-colors duration-300 flex flex-col items-center"
      >
        <div
          class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 w-full"
        >
          <!-- Mode Buttons -->
          <div
            class="flex bg-[#F0F4EF] dark:bg-[#232F27] p-1.5 rounded-2xl w-full sm:w-auto"
          >
            <button
              id="modePvAI"
              onclick="setGameMode('pvai')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer text-[#5C6B5E] dark:text-[#C5D9C3] hover:text-[#2C3E2B]"
            >
              კომპიუტერთან (PvAI)
            </button>

            <button
              id="modePvP"
              onclick="setGameMode('pvp')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer bg-[#3B4A3F] dark:bg-[#5C7062] text-white shadow-sm"
            >
              მეგობართან (PvP)
            </button>
          </div>

          <!-- Control Buttons -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button
              onclick="resetGame()"
              class="flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-[#EAEFE9] dark:bg-[#232F27] text-[#3B4A3F] dark:text-[#E2EAE0] hover:bg-[#D8E2D6] transition text-xs font-medium cursor-pointer"
              title="ახალი თამაში"
            >
              🔄 ახალი
            </button>
            <button
              onclick="resetScores()"
              class="flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-[#EAEFE9] dark:bg-[#232F27] text-[#3B4A3F] dark:text-[#E2EAE0] hover:bg-[#D8E2D6] transition text-xs font-medium cursor-pointer"
              title="ქულების განულება"
            >
              🗑️ განულება
            </button>
          </div>
        </div>

        <!-- Scoreboard -->
        <div class="grid grid-cols-3 gap-3 mb-6 text-center w-full">
          <div
            class="bg-[#F9FBF8] dark:bg-[#232F27] p-3 rounded-2xl border border-[#E5EDE3] dark:border-[#42574A]"
          >
            <span
              class="block text-xs font-bold uppercase tracking-wider text-[#4A5A48] dark:text-[#D2E2D0] mb-1"
              >მოთამაშე X</span
            >
            <span
              id="scoreX"
              class="text-lg font-bold text-[#3B4A3F] dark:text-[#F0F4F0]"
              >0</span
            >
          </div>
          <div
            class="bg-[#F9FBF8] dark:bg-[#232F27] p-3 rounded-2xl border border-[#E5EDE3] dark:border-[#42574A]"
          >
            <span
              class="block text-xs font-bold uppercase tracking-wider text-[#4A5A48] dark:text-[#D2E2D0] mb-1"
              >ფრე</span
            >
            <span
              id="scoreTie"
              class="text-lg font-bold text-[#5C6B5E] dark:text-[#C5D9C3]"
              >0</span
            >
          </div>
          <div
            class="bg-[#F9FBF8] dark:bg-[#232F27] p-3 rounded-2xl border border-[#E5EDE3] dark:border-[#42574A]"
          >
            <span
              class="block text-xs font-bold uppercase tracking-wider text-[#4A5A48] dark:text-[#D2E2D0] mb-1"
              id="labelO"
              >მოთამაშე O</span
            >
            <span
              id="scoreO"
              class="text-lg font-bold text-[#3B4A3F] dark:text-[#F0F4F0]"
              >0</span
            >
          </div>
        </div>

        <!-- Status -->
        <div class="text-center mb-6">
          <p
            id="statusText"
            class="text-sm font-medium tracking-wide text-[#3B4A3F] dark:text-[#F0F4F0] bg-[#EAEFE9] dark:bg-[#232F27] py-2 px-4 rounded-xl inline-block"
          >
            სვლა: X მოთამაშე
          </p>
        </div>

        <!-- Strictly Fixed 3x3 Grid (360x360px) -->
        <div class="grid grid-cols-3 gap-3 w-[360px] h-[360px]">
          <button
            onclick="makeMove(0)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="0"
          ></button>
          <button
            onclick="makeMove(1)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="1"
          ></button>
          <button
            onclick="makeMove(2)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="2"
          ></button>

          <button
            onclick="makeMove(3)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="3"
          ></button>
          <button
            onclick="makeMove(4)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="4"
          ></button>
          <button
            onclick="makeMove(5)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="5"
          ></button>

          <button
            onclick="makeMove(6)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="6"
          ></button>
          <button
            onclick="makeMove(7)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="7"
          ></button>
          <button
            onclick="makeMove(8)"
            class="cell bg-[#F9FBF8] dark:bg-[#232F27] border-2 border-[#D8E2D6] dark:border-[#42574A] rounded-2xl text-4xl font-bold flex items-center justify-center hover:bg-[#EAEFE9] dark:hover:bg-[#2B3A30] cursor-pointer shadow-sm"
            data-index="8"
          ></button>
        </div>
      </div>
    </main>
    <footer
      class="text-center py-8 text-sm text-[#8A9A88] border-t border-[#E2E8E0]"
    >
      <p>© 2026 სიმშვიდის სივრცე. ყველა უფლება დაცულია.</p>
    </footer>
  </body>
</html>
