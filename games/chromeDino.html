<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrome DINO - თამაშები</title>
    <link rel="icon" type="image/png" href="../logo/tabIcon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./chromeDino.js" defer></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>
  <body class="bg-[#F4F6F4] text-[#2C3E50]">
    <!-- ================= First Header (Static) ================= -->
    <header
      class="w-full bg-[#EAEFE9] border-b border-[#D8E2D6] py-4 px-6 transition-colors duration-300"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <!-- Left side: 3 logos with links -->
        <div class="flex items-center gap-4">
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/facebook.svg" alt="facebook link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/instagram.svg" alt="instagram link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/tiktok.svg" alt="tikTok link" />
          </a>
        </div>

        <!-- Center: Centered text -->
        <div class="text-center">
          <p class="text-sm tracking-wide text-[#5C6B5E] font-medium">
            შეისვენე და აღიდგინე ენერგია
          </p>
        </div>

        <!-- Right side: Links (in a box) and Dark/Light mode button -->
        <div class="flex items-center gap-4">
          <!-- Text embedded in a nice background frame -->
          <nav
            class="flex items-center gap-2 bg-[#DFE7DE] px-4 py-1.5 rounded-full shadow-inner"
          >
            <a
              href="../views/aboutUs.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >ჩვენს შესახებ</a
            >
            <span class="text-[#A3B1A0]">•</span>
            <a
              href="../views/feedBack.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >გამოხატე შენი აზრი</a
            >
          </nav>

          <!-- Dark / Light Mode -->
          <button
            id="themeToggle"
            class="p-2 rounded-full bg-[#D8E2D6] hover:bg-[#C4D3C2] text-[#3B4A3F] transition shadow-sm cursor-pointer"
            title="ფერის შეცვლა"
          >
            🌙
          </button>
        </div>
      </div>
    </header>

    <!-- ================= Second Header (Sticky / follows the page) ================= -->
    <header
      class="sticky top-0 z-50 w-full bg-[#FFFFFF]/90 backdrop-blur-md border-b border-[#E2E8E0] shadow-sm transition-all duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <!-- Left side: Main logo -->
        <a href="../index.html" class="flex items-center gap-2 group">
          <div
            class="w-10 h-10 rounded-xl bg-[#E3EBE1] flex items-center justify-center group-hover:bg-[#D2DDD0] transition"
          >
            <img src="../logo/mainLogo.svg" alt="mainLogo" />
          </div>
          <span class="font-semibold text-lg text-[#3B4A3F] tracking-tight"
            >MODE:OFF</span
          >
        </a>

        <!-- Right side  -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-3">
          <a
            href="../views/quizzes.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >ქვიზნი</a
          >
          <a
            href="../views/eyeRest.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თვალის სიმშვიდე</a
          >
          <a
            href="../views/games.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თამაშები</a
          >
          <a
            href="../views/Idleness.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >უსაქმურობა</a
          >
          <a
            href="../views/simplifyYourLife.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >გაიმარტივე ცხოვრება</a
          >
          <a
            href="../views/whatToEat.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >რა ვჭამო?</a
          >
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center px-4 py-2 flex-grow">
      <div
        class="max-w-4xl w-full bg-white dark:bg-[#324338] rounded-3xl shadow-md p-6 text-center border border-[#EBEFEA] dark:border-[#42574A] transition-colors duration-300"
      >
        <h1 class="text-2xl font-bold mb-1 text-[#3B4A3F] dark:text-[#F0F4F0]">
          Chrome Dino
        </h1>
        <p class="text-xs text-[#5C6B5E] dark:text-[#C5D9C3] mb-4">
          დააჭირეთ Space-ს ან ეკრანს გადასახტომად
        </p>

        <!-- Scoreboard -->
        <div
          class="flex justify-between items-center mb-4 px-4 py-2.5 bg-[#F9FBF9] dark:bg-[#232F27] rounded-2xl text-sm font-semibold border border-[#EBEFEA] dark:border-[#42574A]"
        >
          <span class="text-[#5C6B5E] dark:text-[#C5D9C3]"
            >ქულა:
            <strong id="score" class="text-[#3B4A3F] dark:text-[#F0F4F0]"
              >00000</strong
            ></span
          >
          <span class="text-[#5C6B5E] dark:text-[#C5D9C3]"
            >რეკორდი:
            <strong id="high-score" class="text-[#3B4A3F] dark:text-[#F0F4F0]"
              >00000</strong
            ></span
          >
        </div>

        <!-- Game Canvas Area -->
        <div class="relative flex justify-center mb-4">
          <canvas
            id="dinoCanvas"
            width="700"
            height="320"
            class="bg-[#F9FBF9] dark:bg-[#1E2721] rounded-2xl shadow-inner border border-[#EBEFEA] dark:border-[#42574A] cursor-pointer w-full max-w-full h-auto"
          ></canvas>

          <!-- Game Over Overlay -->
          <div
            id="game-over"
            class="hidden absolute inset-0 bg-white/70 dark:bg-black/50 backdrop-blur-[2px] rounded-2xl flex flex-col items-center justify-center"
          >
            <h2
              class="text-xl font-bold mb-3 text-[#3B4A3F] dark:text-white tracking-wide"
            >
              თამაში დასრულდა
            </h2>
            <button
              onclick="resetGame()"
              class="bg-[#3B4A3F] hover:bg-[#2C3E2B] dark:bg-[#5C7062] dark:hover:bg-[#4A5A4F] text-white px-6 py-2.5 rounded-xl transition-colors font-medium cursor-pointer shadow-sm text-xs"
            >
              ↻ თავიდან ცდა
            </button>
          </div>
        </div>

        <button
          onclick="resetGame()"
          id="start-btn"
          class="w-full bg-[#3B4A3F] hover:bg-[#2C3E2B] dark:bg-[#5C7062] dark:hover:bg-[#4A5A4F] text-white py-3 rounded-xl transition-colors font-semibold cursor-pointer shadow-sm text-xs"
        >
          თამაშის დაწყება
        </button>
      </div>
    </main>
    <!-- Footer -->
    <footer
      class="text-center py-8 text-sm text-[#8A9A88] border-t border-[#E2E8E0]"
    >
      <p>© 2026 სიმშვიდის სივრცე. ყველა უფლება დაცულია.</p>
    </footer>
  </body>
</html>
