<!doctype html>
<html lang="ka" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ბუხარი - უსაქმურობა</title>
    <link rel="icon" type="image/png" href="../logo/tabIcon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        background-color: #f7f9f6;
        color: #4a5568;
        font-family: sans-serif;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }
      html,
      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-[#F4F6F4] text-[#2C3E50]">
    <!-- ================= First Header (Static) ================= -->
    <header
      class="w-full bg-[#EAEFE9] border-b border-[#D8E2D6] py-4 px-6 transition-colors duration-300 sticky top-0 z-50 bg-white shadow-md"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <!-- Left side: 3 logos with links -->
        <div class="flex items-center gap-4">
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/facebook.svg" alt="facebook link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/instagram.svg" alt="instagram link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/tiktok.svg" alt="tikTok link" />
          </a>
        </div>

        <!-- Center: Centered text -->
        <div class="text-center">
          <p class="text-sm tracking-wide text-[#5C6B5E] font-medium">
            შეისვენე და აღიდგინე ენერგია
          </p>
        </div>

        <!-- Right side: Links (in a box)-->
        <div class="flex items-center gap-4">
          <!-- Text embedded in a nice background frame -->
          <nav
            class="flex items-center gap-2 bg-[#DFE7DE] px-4 py-1.5 rounded-full shadow-inner"
          >
            <a
              href="../views/aboutUs.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >ჩვენს შესახებ</a
            >
            <span class="text-[#A3B1A0]">•</span>
            <a
              href="../views/feedBack.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >გამოხატე შენი აზრი</a
            >
          </nav>
        </div>
      </div>
    </header>

    <!-- ================= Second Header (Sticky / follows the page) ================= -->
    <header
      class="sticky top-0 z-50 w-full bg-[#FFFFFF]/90 backdrop-blur-md border-b border-[#E2E8E0] shadow-sm transition-all duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <!-- Left side: Main logo -->
        <a href="../index.html" class="flex items-center gap-2 group">
          <div
            class="w-10 h-10 rounded-xl bg-[#E3EBE1] flex items-center justify-center group-hover:bg-[#D2DDD0] transition"
          >
            <img src="../logo/mainLogo.svg" alt="mainLogo" />
          </div>
          <span class="font-semibold text-lg text-[#3B4A3F] tracking-tight"
            >MODE:OFF</span
          >
        </a>

        <!-- Right side  -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-3">
          <a
            href="../views/quizzes.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >ქვიზნი</a
          >
          <a
            href="../views/eyeRest.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თვალის სიმშვიდე</a
          >
          <a
            href="../views/games.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თამაშები</a
          >
          <a
            href="../views/Idleness.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition bg-[#E3EBE1] text-[#2C382A]"
            >უსაქმურობა</a
          >
          <a
            href="../views/simplifyYourLife.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >გაიმარტივე ცხოვრება</a
          >
          <a
            href="../views/whatToEat.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >რა ვჭამო?</a
          >
        </nav>
      </div>
    </header>

    <!-- ================= Third Sub-Header (Idleness Features Submenu) ================= -->
    <div
      class="w-full bg-[#F2F6F1] border-b border-[#E2EAE0] py-2.5 px-6 mb-10"
    >
      <div
        class="max-w-7xl mx-auto flex items-center justify-center gap-2 sm:gap-4 overflow-x-auto"
      >
        <!-- Fireplace Link (Active) -->
        <a
          href="./firePlace.html"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-[#E3EBE1] text-[#2C382A] shadow-sm border border-[#D2DDD0] transition"
        >
          ბუხარი
        </a>

        <!-- Windows Update Link -->
        <a
          href="./windowsUpdate.html"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium text-[#556353] hover:bg-[#EAEFE9] hover:text-[#2C382A] transition"
        >
          Windows Update
        </a>

        <!-- Clock Link -->
        <a
          href="./clock.html"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium text-[#556353] hover:bg-[#EAEFE9] hover:text-[#2C382A] transition"
        >
          საათი
        </a>
      </div>
    </div>

    <div style="text-align: center">
      <iframe
        width="640"
        height="360"
        src="https://www.youtube.com/embed/L_LUpnjgPso"
        title="Fireplace Ambience"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        allowfullscreen
        style="display: inline-block"
      ></iframe>
    </div>
    <!-- footer -->
    <footer
      class="text-center py-8 text-sm text-[#8A9A88] border-t border-[#E2E8E0] mt-10"
    >
      <p>© 2026 სიმშვიდის სივრცე. ყველა უფლება დაცულია.</p>
    </footer>
  </body>
</html>
