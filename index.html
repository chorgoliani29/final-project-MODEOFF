<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MODE:OFF | მთავარი გვერდი</title>
    <link rel="icon" type="image/svg" href="./logos/TABLOGO.svg" />

    <!-- ძირითადი SEO მეტა-აღწერები -->
    <meta
      name="description"
      content="საიტის მოკლე და ტევადი აღწერა ქართულ ენაზე (150-160 სიმბოლომდე), რომელიც მიიზიდავს მომხმარებელს Google-იდან."
    />
    <meta name="keywords" content="საძიებო, სიტყვები, ქართული, ბაზარი" />
    <meta name="author" content="თქვენი კომპანიის სახელი" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn და სხვა სოციალური ქსელებისთვის) -->
    <meta property="og:title" content="თქვენი საიტის სათაური" />
    <meta
      property="og:description"
      content="აღწერა, რომელიც გამოჩნდება სოციალურ ქსელებში გაზიარებისას."
    />
    <meta
      property="og:image"
      content="https://example.com/images/share-image.jpg"
    />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ka_GE" />

    <!-- ფავიკონი (ბრაუზერის პატარა იკონკა) -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/script.js" defer></script>
  </head>
  <body>
    <!-- უძრავი ჰედერი -->

    <header class="static-header">
      <div class="header-items-wrapper">
        <!-- 1. ჩვენს შესახებ -->
        <a href="./htmls/ჩვენს შესახებ.html" class="header-item"
          >ჩვენს შესახებ</a
        >

        <!-- 2. Facebook ლოგო -->
        <a
          href="თქვენი_ფეისბუქის_ლინკი"
          target="_blank"
          aria-label="Facebook"
          class="header-item"
        >
          <img src="./logos/facebook.svg" alt="Facebook" />
        </a>

        <!-- 3. Instagram ლოგო -->
        <a
          href="თქვენი_ინსტაგრამის_ლინკი"
          target="_blank"
          aria-label="Instagram"
          class="header-item"
        >
          <img src="./logos/instagram.svg" alt="Instagram" />
        </a>

        <!-- 4. TikTok ლოგო -->
        <a
          href="თქვენი_ტიკტოკის_ლინკი"
          target="_blank"
          aria-label="TikTok"
          class="header-item"
        >
          <img src="./logos/tiktok.svg" alt="TikTok" />
        </a>

        <!-- 5. უკუკავშირი -->
        <a href="./htmls/უკუკავშირი.html" class="header-item">უკუკავშირი</a>
      </div>
    </header>
  </body>
</html>
