<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MODE: OFF logo</title>
  <desc id="desc">Minimal open door icon with a pause symbol as the handle, followed by the MODE: OFF wordmark.</desc>

  <!-- Brand colors:
       Navy  #1A2C42
       Mint  #48CFAE
  -->

  <g transform="translate(45 35)">
    <!-- Open doorway / frame -->
    <path d="M72 40 L220 15 L220 255 L72 282 Z"
          fill="none" stroke="#1A2C42" stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Mint interior -->
    <path d="M108 57 L196 42 L196 233 L108 249 Z"
          fill="#48CFAE"/>

    <!-- Open navy door -->
    <path d="M72 40 L157 66 L157 248 L72 282 Z"
          fill="#1A2C42"/>

    <!-- Door inner edge -->
    <path d="M157 66 L196 42 L196 233 L157 248 Z"
          fill="#EAFBF6"/>

    <!-- Threshold / light coming through the door -->
    <path d="M72 282 L157 248 L255 292 L160 330 Z"
          fill="#48CFAE" opacity="0.92"/>

    <!-- Pause-symbol handle -->
    <rect x="112" y="143" width="10" height="47" rx="5" fill="#FFFFFF"/>
    <rect x="132" y="140" width="10" height="47" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(340 118)">
    <text x="0" y="105"
          font-family="Inter, Montserrat, Arial, Helvetica, sans-serif"
          font-size="92" font-weight="700"
          letter-spacing="-3"
          fill="#1A2C42">MODE</text>

    <text x="270" y="105"
          font-family="Inter, Montserrat, Arial, Helvetica, sans-serif"
          font-size="92" font-weight="700"
          letter-spacing="-3"
          fill="#48CFAE">: OFF</text>

  </g>
</svg>
