<!doctype html>
<html lang="ka" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>თამაშები - განტვირთვის სივრცე</title>
    <link rel="icon" type="image/png" href="../logo/tabIcon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        background-color: #f7f9f6;
        color: #4a5568;
        font-family: sans-serif;
      }
    </style>
    <script src="../scripts/games.js" defer></script>
    <script>
      // Check localStorage immediately on page load to prevent flashing
      if (localStorage.getItem("theme") === "dark") {
        document.body.style.backgroundColor = "#1A211C";
        document.body.style.color = "#E2E8E0";
      }
    </script>
  </head>
  <body class="bg-[#F4F6F4] text-[#2C3E50]">
    <!-- ================= First Header (Static) ================= -->
    <header
      class="w-full bg-[#EAEFE9] border-b border-[#D8E2D6] py-4 px-6 transition-colors duration-300"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <!-- Left side: 3 logos with links -->
        <div class="flex items-center gap-4">
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/facebook.svg" alt="facebook link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/instagram.svg" alt="instagram link" />
          </a>
          <a
            href="#"
            class="w-9 h-9 rounded-full bg-[#D8E2D6] flex items-center justify-center hover:bg-[#C4D3C2] transition shadow-sm"
          >
            <img src="../images/tiktok.svg" alt="tikTok link" />
          </a>
        </div>

        <!-- Center: Centered text -->
        <div class="text-center">
          <p class="text-sm tracking-wide text-[#5C6B5E] font-medium">
            შეისვენე და აღიდგინე ენერგია
          </p>
        </div>

        <!-- Right side: Links (in a box) -->
        <div class="flex items-center gap-4">
          <!-- Text embedded in a nice background frame -->
          <nav
            class="flex items-center gap-2 bg-[#DFE7DE] px-4 py-1.5 rounded-full shadow-inner"
          >
            <a
              href="../views/aboutUs.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >ჩვენს შესახებ</a
            >
            <span class="text-[#A3B1A0]">•</span>
            <a
              href="../views/feedBack.html"
              class="text-xs font-medium text-[#4A5548] hover:text-[#2C3E2B] transition px-2 py-1 rounded-md hover:bg-[#D2DCF0]/50"
              >გამოხატე შენი აზრი</a
            >
          </nav>
        </div>
      </div>
    </header>

    <!-- ================= Second Header (Sticky / follows the page) ================= -->
    <header
      class="sticky top-0 z-50 w-full bg-[#FFFFFF]/90 backdrop-blur-md border-b border-[#E2E8E0] shadow-sm transition-all duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <!-- Left side: Main logo -->
        <a href="../index.html" class="flex items-center gap-2 group">
          <div
            class="w-10 h-10 rounded-xl bg-[#E3EBE1] flex items-center justify-center group-hover:bg-[#D2DDD0] transition"
          >
            <img src="../logo/mainLogo.svg" alt="mainLogo" />
          </div>
          <span class="font-semibold text-lg text-[#3B4A3F] tracking-tight"
            >MODE:OFF</span
          >
        </a>

        <!-- Right side  -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-3">
          <a
            href="../views/quizzes.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >ქვიზნი</a
          >
          <a
            href="../views/eyeRest.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თვალის სიმშვიდე</a
          >
          <a
            href="../views/games.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >თამაშები</a
          >
          <a
            href="../views/Idleness.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >უსაქმურობა</a
          >
          <a
            href="../views/simplifyYourLife.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >გაიმარტივე ცხოვრება</a
          >
          <a
            href="../views/whatToEat.html"
            class="px-3 py-2 rounded-lg text-sm font-medium text-[#556353] hover:bg-[#F0F4EF] hover:text-[#2C382A] transition"
            >რა ვჭამო?</a
          >
        </nav>
      </div>
    </header>

    <!-- Games Grid Container -->
    <div class="max-w-7xl mx-auto px-6 py-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 1. Tic-Tac-Toe Card -->
        <a
          href="../games/ticTacToe.html"
          class="group bg-white dark:bg-[#324338] p-4 rounded-2xl border border-[#EBEFEA] dark:border-[#42574A] shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between cursor-pointer"
        >
          <!-- visual -->
          <div
            class="w-full h-36 rounded-xl bg-[#E3EBE1] dark:bg-[#232F27] overflow-hidden flex items-center justify-center mb-4 group-hover:scale-[1.02] transition-transform duration-300"
          >
            <span class="text-4xl">❌⭕</span>
          </div>

          <!-- only name-->
          <div class="text-center pb-2">
            <h3
              class="text-base font-semibold text-[#3B4A3F] dark:text-[#F0F4F0] group-hover:text-[#5C7062] dark:group-hover:text-[#C5D9C3] transition-colors"
            >
              Tic-Tac-Toe
            </h3>
          </div>
        </a>

        <!-- 2. Snake Game Card -->
        <a
          href="../games/snake.html"
          class="group bg-white dark:bg-[#324338] p-4 rounded-2xl border border-[#EBEFEA] dark:border-[#42574A] shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between cursor-pointer"
        >
          <div
            class="w-full h-36 rounded-xl bg-[#E3EBE1] dark:bg-[#232F27] overflow-hidden flex items-center justify-center mb-4 group-hover:scale-[1.02] transition-transform duration-300"
          >
            <span class="text-4xl">🐉</span>
          </div>
          <div class="text-center pb-2">
            <h3
              class="text-base font-semibold text-[#3B4A3F] dark:text-[#F0F4F0] group-hover:text-[#5C7062] dark:group-hover:text-[#C5D9C3] transition-colors"
            >
              SNAKE
            </h3>
          </div>
        </a>

        <!-- 3. Chrom DINO -->
        <a
          href="../games/chromeDino.html"
          class="group bg-white dark:bg-[#324338] p-4 rounded-2xl border border-[#EBEFEA] dark:border-[#42574A] shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between cursor-pointer"
        >
          <div
            class="w-full h-36 rounded-xl bg-[#E3EBE1] dark:bg-[#232F27] overflow-hidden flex items-center justify-center mb-4 group-hover:scale-[1.02] transition-transform duration-300"
          >
            <span class="text-4xl">🦖</span>
          </div>
          <div class="text-center pb-2">
            <h3
              class="text-base font-semibold text-[#3B4A3F] dark:text-[#F0F4F0] group-hover:text-[#5C7062] dark:group-hover:text-[#C5D9C3] transition-colors"
            >
              Chrome DINO
            </h3>
          </div>
        </a>
      </div>
    </div>

    <!-- footer -->
    <footer
      class="text-center py-8 text-sm text-[#8A9A88] border-t border-[#E2E8E0]"
    >
      <p>© 2026 სიმშვიდის სივრცე. ყველა უფლება დაცულია.</p>
    </footer>
  </body>
</html>
